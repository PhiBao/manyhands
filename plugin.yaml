name: manyhands
version: 0.5.1
manifest_version: 2
api_version: 1
description: >-
  One Hermes, many people. Every sender who talks to your bot gets their own identity, their own
  memory namespace, their own tool allowlist and their own approvals — and the owner can see who
  asked for what. Resolves (platform, sender_id) in pre_llm_call, enforces a role -> tool allowlist
  in pre_tool_call, escalates anything sensitive to the owner's DM through a registered approval
  transport, and keeps turns, refusals, approvals and token usage in a local SQLite audit trail.
  Six tools, one slash command, no third-party dependencies.
author: PhiBao
license: MIT
homepage: https://github.com/PhiBao/manyhands
tags: [multi-user, permissions, roles, approvals, memory, identity, household, team]
requires_hermes: ">=0.23.0"
provides_tools:
  - manyhands_whoami
  - manyhands_people
  - manyhands_remember
  - manyhands_recall
  - manyhands_share
  - manyhands_audit
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_api_request
# The manifest parser currently ignores this key with a "unknown manifest field" warning, but the
# validator REQUIRES it ("declared middleware — undeclared middleware registered"), so it stays.
provides_middleware:
  - llm_request
config_schema:
  unknown_sender_policy:
    type: string
    default: invite
    description: "What to do with a sender who is not on the roster: invite (refuse until they redeem a code), open (auto-guest), closed (refuse)."
  invite_role:
    type: string
    default: member
    description: "Role a person gets when they redeem an invite code."
  max_person_facts:
    type: int
    default: 8
    description: "How many of a person's own facts are injected into their turns."
  max_shared_facts:
    type: int
    default: 5
    description: "How many shared facts are injected into every turn."
  approval_timeout_s:
    type: int
    default: 120
    description: "How long the owner's DM approval waits before failing closed."
  approval_tools:
    type: list
    description: "Override the per-role ASK bucket with one list for every non-owner. Leave unset: members ask on write/execute/spend, guests never escalate."
  scope_host_memory:
    type: bool
    default: true
    description: "Withhold the operator's own MEMORY.md / USER.md blocks from a non-owner's system prompt (llm_request middleware)."
  unknown_session_policy:
    type: string
    default: guest
    description: "A session with no human turn on it (restart, subagent, socket): guest fails closed, operator trusts the host."
  local_seat_policy:
    type: string
    default: operator
    description: "The operator's own terminal (platform cli/local with this machine's attested uid): operator is the host's own seat, roster makes it join like any other sender."
  db_path:
    type: string
    default: ""
    description: "Where the plugin's SQLite file lives. Empty = the host's plugin-data/manyhands/ directory. Set it in config.yaml, not .env."
  paused:
    type: bool
    default: false
    description: "Switch enforcement off at runtime with /many pause; this is the persisted default."
